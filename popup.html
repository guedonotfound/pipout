<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pipout</title>
<style>
  :root {
    --bg: #fff; --fg: #1d1d1f; --muted: #6b6b73; --line: #e6e6ea; --tile: #f5f5f7;
    --accent: #0c8f7a; --note-bg: #eef7f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #232327; --fg: #f2f2f4; --muted: #9a9aa3; --line: #34343a; --tile: #2c2c31;
      --accent: #3fd1b5; --note-bg: #22312e; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; width: 300px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header img { width: 24px; height: 24px; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  section { padding: 4px 16px 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row small { display: block; color: var(--muted); font-size: 11px; }
  .row span { min-width: 0; overflow-wrap: anywhere; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch i { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; pointer-events: none; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(14px); }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { margin: 0 16px 14px; padding: 10px 12px; border-radius: 10px; background: var(--note-bg); font-size: 12px; color: var(--fg); }
  .note button { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Pipout</h1>
  </header>

  <section>
    <label class="row">
      <span>Ativado</span>
      <span class="switch"><input type="checkbox" id="enabled"><i></i></span>
    </label>
    <label class="row" id="siteRow">
      <span>Ativo neste site<small id="siteName"></small></span>
      <span class="switch"><input type="checkbox" id="site"><i></i></span>
    </label>
    <label class="row">
      <span>Abrir sozinho ao trocar de aba<small>Coloca o vídeo que está tocando em PiP quando você sai da aba</small></span>
      <span class="switch"><input type="checkbox" id="autoOnTabSwitch"><i></i></span>
    </label>
  </section>

  <div class="note" id="autoNote" hidden>
    O navegador só libera o PiP automático se você interagiu com a página pouco antes de trocar de aba
    (ex.: clicou no vídeo). Se não abrir, confira se o navegador permite <b>Picture-in-picture automático</b>.
    <button id="openAutoSetting" type="button">Abrir configuração</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
